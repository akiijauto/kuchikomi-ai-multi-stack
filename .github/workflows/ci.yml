name: CI

# ローカルにDockerが無くてもDockerfile/composeを実地検証できるようにする。
# GitHubのランナー(ubuntu-latest)にはDockerが入っているため、
# 「イメージが本当にビルドできるか」「起動して応答するか」をここで確かめる。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: 型チェック / Lint / ビルド
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 型チェック
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: 本番ビルド
        # NEXT_PUBLIC_* はビルド時に埋め込まれる公開値。CIではダミーで十分
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-build
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: standalone出力が自己完結しているか
        run: test -f .next/standalone/server.js

  docker:
    name: Dockerイメージのビルドと起動確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: イメージをビルド
        # ビルドサマリーのアーティファクト添付を無効化。
        # 有効だと CreateArtifact が「Artifact storage quota has been hit」で
        # 毎回警告になる（ビルド自体は成功する）。CIの出力を綺麗に保つため切る。
        env:
          DOCKER_BUILD_SUMMARY: "false"
        uses: docker/build-push-action@v6
        with:
          context: ./web
          target: runner
          load: true
          tags: kuchikomi-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: イメージサイズを記録
        run: docker image ls kuchikomi-ai:ci
      - name: 起動してヘルスチェックが通るか
        run: |
          docker run -d --name app -p 3000:3000 kuchikomi-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo; echo "ヘルスチェック応答あり"; exit 0
            fi
            sleep 2
          done
          echo "30回試して応答なし。コンテナログ:"; docker logs app; exit 1
      - name: 非rootで動いているか
        run: test "$(docker exec app id -u)" != "0"
      - name: 後片付け
        if: always()
        run: docker rm -f app || true

  compose:
    name: docker compose の疎通確認（web + Postgres）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 本番相当モードで起動（override.ymlを読ませない）
        run: docker compose -f docker-compose.yml up -d --build --wait
      - name: web が応答するか
        run: curl -fsS http://localhost:3000/api/health
      - name: 初期化SQLでテーブルが作られたか
        run: |
          docker compose -f docker-compose.yml exec -T db \
            psql -U postgres -d kuchikomi -c '\dt public.*'
      - name: 上限チェック関数が作られたか
        run: |
          docker compose -f docker-compose.yml exec -T db \
            psql -U postgres -d kuchikomi -tAc \
            "select proname from pg_proc where proname='increment_usage';" | grep -q increment_usage
      - name: 失敗時のログ
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color
      - name: 後片付け
        if: always()
        run: docker compose -f docker-compose.yml down -v || true

  compose-dev:
    name: 開発モードのホットリロード確認（override.yml 側）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 開発モードで起動（override.yml が自動で重なる）
        # dev ステージには HEALTHCHECK が無いので --wait は使えない。db だけ待って web は自前でポーリングする
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "起動せず。ログ:"; docker compose logs --no-color web; exit 1
      - name: 変更前の応答を記録
        run: curl -fsS http://localhost:3000/api/health | tee before.json
      - name: ホスト側のソースを書き換える（バインドマウント越し）
        run: |
          sed -i 's/status: "ok"/status: "ok", reloaded: true/' web/src/app/api/health/route.ts
          grep -n reloaded web/src/app/api/health/route.ts
      - name: 再ビルドや再起動なしで応答が変わるか
        run: |
          for i in $(seq 1 30); do
            body=$(curl -fsS http://localhost:3000/api/health || true)
            if echo "$body" | grep -q '"reloaded":true'; then
              echo "$body"; echo "ホットリロード成立（${i}回目の確認で反映）"; exit 0
            fi
            sleep 2
          done
          echo "60秒待っても反映されず。ログ:"; docker compose logs --no-color web; exit 1
      - name: 失敗時のログ
        if: failure()
        run: docker compose logs --no-color
      - name: 後片付け
        if: always()
        run: docker compose down -v || true

  rails:
    name: Rails APIのテスト（Next.js版と同じスキーマに対して）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-rails
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kuchikomi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # RailsのマイグレーションではなくSQL側の定義を使う。
      # Next.js版と同じ web/supabase/schema.sql を流し込んでから実行する。
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kuchikomi
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: api-rails
      - name: Next.js版と同じスキーマを流し込む
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../db/init/00_supabase_compat.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../web/supabase/schema.sql
      - name: 自動読み込みの検査
        run: bundle exec rails zeitwerk:check
      - name: RSpec
        run: bundle exec rspec --format documentation

  rails-container:
    name: Railsコンテナの起動確認（デモ画面まで通るか）
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kuchikomi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Next.js版と同じスキーマを流し込む
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/kuchikomi" -v ON_ERROR_STOP=1 -f db/init/00_supabase_compat.sql
          psql "postgresql://postgres:postgres@localhost:5432/kuchikomi" -v ON_ERROR_STOP=1 -f web/supabase/schema.sql
      - uses: docker/setup-buildx-action@v3
      - name: イメージをビルド
        env:
          DOCKER_BUILD_SUMMARY: "false"
        uses: docker/build-push-action@v6
        with:
          context: ./api-rails
          load: true
          tags: kuchikomi-rails:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 起動する（TLS終端が無い構成なのでSSL強制は切る）
        run: |
          # ポート80は使わない。イメージは非rootで動くため、ホストネットワークでは
          # 1024未満を掴めない（ホスト側の ip_unprivileged_port_start が 1024）。
          # Thrusterの待ち受けを8080に、その先のRailsを3000にずらす。
          docker run -d --name rails --network host             -e RAILS_ENV=production             -e RAILS_FORCE_SSL=false             -e DEMO_MODE=1             -e HTTP_PORT=8080             -e TARGET_PORT=3000             -e SECRET_KEY_BASE=$(openssl rand -hex 32)             -e SUPABASE_JWT_SECRET=ci-demo-secret             -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/kuchikomi             kuchikomi-rails:ci
          # 待ちループは必ず「起動しなかった」で落ちるように書く。
          # `curl || sleep` だけだと最後のsleepが成功して、
          # 一度も応答が無くてもステップが緑になる（2026-09-03に実際に踏んだ）。
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "80秒待っても応答なし。ログ:"; docker logs rails; exit 1
      - name: 非rootで動いているか
        run: test "$(docker exec rails id -u)" != "0"
      - name: デモ画面が配信されるか
        run: curl -fsS http://localhost:8080/demo.html | grep -q "Rails API デモ"
      - name: デモ用トークンを受け取り、生成まで通るか
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/demo/token | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          BODY=$(curl -fsS -X POST http://localhost:8080/api/generate             -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             -d '{"review":{"reviewText":"スープが本当に美味しかったです","rating":5}}')
          echo "$BODY" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert len(d['replies']) == 3, d
          assert d['usage']['used'] == 1, d
          print('返信案', len(d['replies']), '件 / 利用', d['usage'])
          "
      - name: 認証なしでは拒否されるか
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/generate             -H "Content-Type: application/json" -d '{"review":{"reviewText":"テストです","rating":5}}')
          test "$code" = "401" || { echo "401ではなく $code"; exit 1; }
      - name: 失敗時のログ
        if: failure()
        run: docker logs rails || true
      - name: 後片付け
        if: always()
        run: docker rm -f rails || true

  terraform:
    name: Terraform の書式と検証
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
      - name: 書式が揃っているか
        run: terraform fmt -check -recursive
      - name: 初期化（AWS認証は不要。プロバイダの取得のみ）
        run: terraform init -backend=false -input=false
      - name: 構成の検証
        run: terraform validate -no-color
